name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--config src-tauri/tauri.windows.conf.json"
          - os: macos-latest
            args: "--config src-tauri/tauri.macos.conf.json"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install frontend deps
        run: npm ci

      - name: generate icon set (adds icon.icns for macOS)
        run: npx tauri icon src-tauri/icons/icon.png

      - name: typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: summary parser unit tests
        run: node scripts/summary-check.mjs

      - name: build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-viewer-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
